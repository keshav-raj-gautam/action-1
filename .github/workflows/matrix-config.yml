name: Matrix configuration
on:
    push:
    workflow_dispatch: 
jobs:
    deploy:
      strategy:
        matrix: # a matrix can be used to define variables that can be used multiple times in workflow, reducing the requirement to write multiple jobs
          os: [ubuntu-latest, ubuntu-20.04, windows-latest]
          images: [hello-world, alpine]
      runs-on: ${{ matrix.os }}
    
      steps:
      - name: Echo docker details
        run: docker info

      - name: Run image on ${{matrix.os}}
        run: docker run ${{matrix.images}}


